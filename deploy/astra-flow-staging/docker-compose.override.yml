# Astra Flow staging resource/port overlay for the community prebuilt-image stack.
# Files only — do not deploy from this agent session.
#
# Usage (from repo root):
#   docker compose \
#     -f deployments/cli/community/docker-compose.yml \
#     -f deploy/astra-flow-staging/docker-compose.override.yml \
#     --env-file deployments/cli/community/variables.env \
#     config
#   (FLOW_PROXY_PORT is required; host/port TBD pending review — do not hard-code.)
#
# Prebuilt images only (inherits makeplane/* + postgres/valkey/rabbitmq/silo from the base file).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

  space:
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.2
    logging: *default-logging

  admin:
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.2
    logging: *default-logging

  live:
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

  api:
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.75
    environment:
      GUNICORN_WORKERS: "2"
    logging: *default-logging

  worker:
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  beat-worker:
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.1
    logging: *default-logging

  migrator:
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  plane-db:
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *default-logging

  plane-redis:
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.1
    logging: *default-logging

  plane-mq:
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.25
    # Keep RabbitMQ's internal high watermark at ~60% of the container mem_limit.
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.6"
    logging: *default-logging

  plane-minio:
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.25
    volumes:
      - uploads:/export
    logging: *default-logging

  proxy:
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    # Staging preview only — loopback HTTP. Host/port TBD (pending review); set FLOW_PROXY_PORT.
    # !override replaces community published :80/:443 so staging does not bind host 80/443.
    ports: !override
      - "127.0.0.1:${FLOW_PROXY_PORT:?set FLOW_PROXY_PORT}:80"
    logging: *default-logging

volumes:
  # Named volumes for durable postgres + object storage on this staging host.
  pgdata:
    name: astra_flow_staging_pgdata
  uploads:
    name: astra_flow_staging_uploads
